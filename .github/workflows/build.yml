# Publishes the wf2a .NET tool to nuget.org when a v* tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# The package version is the tag without its leading "v".
#
# Authentication is nuget.org Trusted Publishing - no API key is stored anywhere. One-time setup:
#   1. nuget.org -> Trusted Publishing -> add a policy for owner k0zi, repository WinformsToAvalonia,
#      workflow file build.yml.
#   2. GitHub repo secret NUGET_USER = your nuget.org profile name (not an email, not a key).
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 0.2.0)'
        required: true

permissions:
  contents: write   # the GitHub release
  id-token: write   # Trusted Publishing's OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # The unit-level suites. Integration tests shell out to dotnet build/run on generated projects
      # (and need wasm-tools); they stay a local check.
      - name: Test
        run: |
          dotnet test tests/WinFormsToAvalonia.Core.Tests -c Release
          dotnet test tests/WinFormsToAvalonia.Mapping.Tests -c Release

      - name: Pack
        run: dotnet pack src/WinFormsToAvalonia.Cli -c Release -p:Version=${{ steps.version.outputs.value }}

      # The fallback templates are embedded resources of a referenced project - a packaging change
      # can drop them without any build noticing. Installing the real package and converting the
      # sample is the only check that sees it.
      - name: Smoke-test the installed tool
        run: |
          dotnet tool install --tool-path ./tool --add-source ./artifacts WinFormsToAvalonia --version ${{ steps.version.outputs.value }}
          ./tool/wf2a convert --source samples/WinForms/All-In-One-WinForms/All-In-One-WinForms.csproj --output ./smoke
          dotnet build ./smoke -nodeReuse:false

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
